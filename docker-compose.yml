version: '3.9'

services:
  # LLM Local — Ollama (IA offline para engenharia elétrica)
  ollama:
    image: ollama/ollama:latest
    container_name: bim_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Para habilitar GPU NVIDIA, descomente as linhas abaixo:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Banco de dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: bim_postgres
    environment:
      POSTGRES_USER: bim
      POSTGRES_PASSWORD: bim123
      POSTGRES_DB: bim_eletrico
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bim -d bim_eletrico"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bim_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://bim:bim123@postgres:5432/bim_eletrico
      DATABASE_URL_SYNC: postgresql://bim:bim123@postgres:5432/bim_eletrico
      DEBUG: "false"
      CORS_ORIGINS: '["http://localhost:3000"]'
      OLLAMA_URL: http://ollama:11434
      AI_MODEL: llama3.2:3b
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bim_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  ollama_data:
